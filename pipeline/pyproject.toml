[project]
name = "claimcheck"
version = "0.1.0"
description = "ClaimCheck pipeline: tags the statements in YouTube videos and finds sources for claims, with Google ADK and Gemini"
requires-python = ">=3.11"
dependencies = [
  "google-adk[gcp]>=2.8",
  "google-genai>=2.30",
  "parallel-web>=1.3",
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "supabase>=2.4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claimcheck*"]

[tool.setuptools.package-data]
claimcheck = ["policy.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
