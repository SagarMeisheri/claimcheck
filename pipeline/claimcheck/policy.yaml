# ClaimCheck content policy and source policy.
# Changing this file changes behaviour without touching prompts.
# Loaded by claimcheck/policy.py. ClaimCheck tags statements and, on request, shows web sources for a statement.
# It never judges a claim true or false.

version: 2

# --- Extraction ------------------------------------------
claims:
  max_extracted: 150           # hard cap on statements kept from extraction (all types)

# Statements about these topics are stored redacted and never shown, whatever their type.
never_topics: [religious_belief, community_generalisation, private_individual, minor, live_court_case,
               breaking_disaster, satire]

pestle_areas: [political, economic, social, technological, legal, environmental]

# --- Sources --------------------------------------------------------------------
# Whatever the web search returns is shown. Tiers below are only a display label ("Official source",
# "News or research organisation"); they never hide a result. The blocklist is sent to Parallel with the search.
# The two camps the opinion check looks up, by the show's country code (agents/opinion.py). The model doesn't choose who counts.
politics:
  in:
    ruling: "the BJP-led National Democratic Alliance (NDA) government"
    opposition: "the opposition: the Indian National Congress and the INDIA bloc parties"
  us:
    ruling: "the party that holds the presidency"
    opposition: "the main opposition party"
  gb:
    ruling: "the party that leads the government"
    opposition: "the main opposition parties"
  default:
    ruling: "the governing party or coalition"
    opposition: "the main opposition parties"

sources:
  # Pages that are the episode itself or a listing / transcript of it. They repeat what was said, so they can't be a
  # source for it: the research lookup drops them (agents/independence.py).
  same_episode_hosts: [listennotes.com, podscripts.co, podchaser.com, podtail.com, player.fm, spotify.com, podcasts.apple.com,
                       castbox.fm, ulisten.ai, tapesearch.com, snipd.com, podbean.com, youtubetranscript.com, tactiq.io,
                       happyscribe.com, podcastindex.org, pocketcasts.com, overcast.fm, deezer.com]
  tier1_suffixes: [".gov.in", ".nic.in", ".gov"]
  tier1_domains:
    - rbi.org.in
    - sebi.gov.in
    - mospi.gov.in
    - pib.gov.in
    - eci.gov.in
    - incometaxindia.gov.in
    - epfindia.gov.in
    - fssai.gov.in
    - icmr.gov.in
    - ncrb.gov.in
    - censusindia.gov.in
    - indiabudget.gov.in
    - sansad.in
    - indiacode.nic.in
    - egazette.gov.in
    - main.sci.gov.in
    - sci.gov.in
    - npci.org.in
    - trai.gov.in
    - isro.gov.in
    - cpcb.nic.in
    - imd.gov.in
    - pubmed.ncbi.nlm.nih.gov
    - ncbi.nlm.nih.gov
    - who.int
    - worldbank.org
    - imf.org
    - data.gov.in
    - nseindia.com
    - bseindia.com
    - amfiindia.com
    - irdai.gov.in
    - prsindia.org
    - cochranelibrary.com
  tier2_domains:
    - reuters.com
    - apnews.com
    - bloomberg.com
    - bbc.com
    - thehindu.com
    - indianexpress.com
    - livemint.com
    - business-standard.com
    - economictimes.indiatimes.com
    - hindustantimes.com
    - thehindubusinessline.com
    - ft.com
    - nature.com
    - thelancet.com
    - nejm.org
    - bmj.com
    - jamanetwork.com
    - cmie.com
  # Never returned as a source: posts and videos aren't sources (Parallel allows at most 10 domains per policy).
  blocklist:
    - x.com
    - twitter.com
    - facebook.com
    - instagram.com
    - youtube.com
    - reddit.com
    - quora.com
    - whatsapp.com
    - sharechat.com
    - koo.in

